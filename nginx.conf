server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root   /usr/share/nginx/html;

    location / {
        index  index.html;
    }

    # Music helper (api/server.py). Looked up at request time, so the site still starts if the helper is down.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api http://shinsoku-api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Player trace from the app's ?debug mode: the request line itself is the log entry (see docker logs).
    location = /__log {
        return 204;
    }
}
